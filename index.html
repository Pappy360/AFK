<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pappy360 Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="blob-container">
    <img id="blob-btn" alt="Blob" draggable="false">
  </div>

  <div id="upgrade-container">
    <h2>Upgrades</h2>
    <p>Size per second: <span id="cps-display"></span></p>
    <p>Upgrade cost: <span id="upgrade-cost"></span></p>
    <button id="upgrade-btn">Upgrade</button>
  </div>

  <div id="milestone-popup"></div>

  <!-- Bed button -->
  <button id="bed-btn" style="margin-top:20px;">Go to Bed</button>

  <!-- Size display -->
  <h1 id="size-counter">0</h1>

  <script src="script.js"></script>
</body>
</html>
