<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Blob Clicker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Blob Clicker</h1>

  <!-- Size Counter -->
  <p>Size: <span id="size-counter">0</span></p>

  <!-- Clickable Blob PNG -->
  <div id="blob-container">
    <img id="blob-btn" src="Normal.png" alt="Click me" />
  </div>

  <!-- Particle container -->
  <div id="particles"></div>

  <!-- Upgrade Section -->
  <div id="upgrade-container">
    <h2>Upgrades</h2>
    <button id="upgrade-btn">Buy CPS Upgrade (Cost: <span id="upgrade-cost">10</span>)</button>
    <p>CPS: <span id="cps-display">0</span></p>
  </div>

  <!-- Milestone popup -->
  <div id="milestone-popup"></div>

  <script src="script.js"></script>
</body>
</html>
